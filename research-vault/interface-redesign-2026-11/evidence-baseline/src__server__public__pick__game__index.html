<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#151517">
  <title>Во что поиграть сегодня — TASTIQ</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="/pick/style.css">
  <link rel="stylesheet" href="/pick/game/style.css">
</head>
<body class="game-dialogue">
  <header class="game-header">
    <a class="game-brand" href="/">TASTIQ</a>
    <span>Во что поиграть сегодня</span>
    <button class="btn btn-plain" type="button" data-act="focus-history">Моё</button>
  </header>
  <nav class="game-navigation" aria-label="Навигация подбора">
    <button type="button" class="btn btn-secondary" data-act="back" id="back">Назад</button>
    <a href="/pick/">Другой подбор</a>
    <div class="game-restart"><button type="button" class="btn btn-plain" data-act="restore-previous" id="restore" hidden>Вернуть прошлый подбор</button><button type="button" class="btn btn-plain" data-act="restart" id="restart">Новый подбор</button></div>
  </nav>
  <div class="game-workspace">
    <main id="main" tabindex="-1"><h1>Начнём с того, чего хочется сегодня</h1><p>Открываю подбор…</p></main>
    <aside id="understanding" class="game-understanding" aria-label="Понимание запроса"></aside>
  </div>
  <footer id="actions" class="game-actions"><div id="notice" class="game-notice" role="status" aria-live="polite"></div><div id="error" class="game-error" role="alert" hidden></div><div id="action-controls" class="game-action-controls"></div></footer>
  <noscript><p>Для подбора нужно включить JavaScript.</p></noscript>
  <script type="module" src="/pick/game/app.js"></script>
</body>
</html>
