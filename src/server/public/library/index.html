<body class="selection-design product-page conversation-page library-page">
  <a class="library-skip" href="#library-content">К библиотеке</a>
  <div class="conversation-app">
    <header class="library-shell" aria-label="Навигация TASTIQ">
      <a class="library-brand" href="/" aria-label="TASTIQ — главная"><img src="/assets/brand/tastiq-logo-cobalt.svg" alt="TASTIQ" width="122" height="32"></a>
      <nav aria-label="Основное"><a href="/pick/start/">Подбор</a><a href="/library/" aria-current="page">Библиотека</a></nav>

      <main class="board-library" id="library-content" tabindex="-1">
        <div id="library-app" aria-busy="true"><h1>Библиотека</h1><p class="library-loading" role="status">Открываю библиотеку…</p></div>
        <noscript><p class="library-empty">Включи JavaScript, чтобы увидеть сохранённые названия в этом браузере.</p></noscript>
      </main>
    </div>
  </div>
  <dialog id="work-dialog" aria-labelledby="work-title"></dialog>
  <div class="library-notice" id="library-notice" role="status" hidden></div>
